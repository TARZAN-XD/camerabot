<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة اختبار واتساب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Cairo', sans-serif;
        background: linear-gradient(135deg, #0d0d0d, #1c1c1c);
        color: #fff;
        text-align: center;
        margin: 0;
        padding: 0;
    }
    header {
        background: #111;
        padding: 20px;
        font-size: 28px;
        font-weight: bold;
        color: #00ff99;
        letter-spacing: 1px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .container {
        max-width: 500px;
        margin: 40px auto;
        background: #181818;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 25px rgba(0,0,0,0.6);
    }
    h1 {
        font-size: 24px;
        margin-bottom: 15px;
        color: #00ff99;
    }
    #qr {
        font-size: 18px;
        padding: 15px;
        background: #222;
        border: 2px dashed #00ff99;
        border-radius: 10px;
        margin-bottom: 20px;
        color: #ccc;
        word-wrap: break-word;
    }
    input {
        width: 90%;
        padding: 12px;
        margin-bottom: 20px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        background: #2a2a2a;
        color: #fff;
        outline: none;
    }
    .btn-group {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
    }
    button {
        flex: 1;
        padding: 14px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #00ff99;
        color: #000;
        transition: 0.3s;
        min-width: 110px;
    }
    button:hover {
        background: #00cc7a;
    }
    #status, #pair-result {
        margin-top: 20px;
        font-size: 18px;
        color: #fff;
        min-height: 24px;
    }
    #pair-result {
        color: #00ff99;
        font-size: 20px;
    }
</style>
</head>
<body>
<header>لوحة اختبار واتساب</header>

<div class="container">
    <h1>اختبارات واتساب</h1>
    <p>امسح رمز QR من هنا:</p>
    <div id="qr">جاري تحميل QR...</div>
    <hr style="border-color:#333;">

    <input type="text" id="number" placeholder="رقم واتساب (9665xxxxxxx)" />

    <div class="btn-group">
        <button onclick="sendCommand('bug')">BUG</button>
        <button onclick="sendCommand('crash')">CRASH</button>
        <button onclick="sendCommand('protocol1')">PROTOCOL</button>
        <button onclick="sendPairCode()">PAIR CODE</button>
    </div>

    <p id="status"></p>
    <div id="pair-result"></div>
</div>

<script>
// تحديث QR تلقائياً
async function loadQR() {
    try {
        const qrDiv = document.getElementById('qr');
        const res = await fetch('/qr?' + Date.now(), { cache: "no-store" });
        qrDiv.innerHTML = res.ok ? await res.text() : 'لا يوجد QR حالياً';
    } catch {
        document.getElementById('qr').innerHTML = 'خطأ في تحميل QR';
    }
}
loadQR();
setInterval(loadQR, 4000);

// إرسال الأوامر العادية
async function sendCommand(cmd) {
    const number = document.getElementById('number').value.trim();
    if (!number) { alert('أدخل الرقم'); return; }

    const status = document.getElementById('status');
    status.textContent = 'جارٍ الإرسال...';

    try {
        const res = await fetch(`/send-${cmd}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ number })
        });
        status.textContent = await res.text();
    } catch (e) {
        status.textContent = '❌ خطأ في الاتصال بالسيرفر';
    }
}

// طلب رمز الاقتران Pair Code
async function sendPairCode() {
    const number = document.getElementById('number').value.trim();
    if (!number) { alert('أدخل الرقم أولاً'); return; }

    const pairBox = document.getElementById('pair-result');
    pairBox.textContent = 'جارٍ طلب رمز الاقتران...';

    try {
        const res = await fetch(`/pair-code?number=${encodeURIComponent(number)}`);
        if (!res.ok) {
            pairBox.textContent = '❌ فشل الحصول على رمز الاقتران';
            return;
        }
        const text = await res.text();
        pairBox.innerHTML = text;
    } catch (e) {
        pairBox.textContent = '❌ خطأ في الاتصال بالسيرفر';
    }
}
</script>

</body>
</html>
